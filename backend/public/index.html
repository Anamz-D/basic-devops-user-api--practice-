<!DOCTYPE html>
<html>
<head>
    <title>DevOps User App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>DevOps User Management</h1>

        <p>Add users to our MongoDB database.</p>

        <form id="userForm">

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <button type="submit">Add User</button>

        </form>

        <h2>Registered Users</h2>

        <ul id="userList"></ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
