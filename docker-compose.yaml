services:

  backend:
    build: ./backend

    container_name: user-backend

    ports:
      - "3000:3000"

    environment:
      MONGO_URL: ${MONGO_URL}

    depends_on:
      mongo:
        condition: service_healthy

    restart: unless-stopped

  mongo:
    image: mongo:8.0

    container_name: user-database

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  mongo_data: