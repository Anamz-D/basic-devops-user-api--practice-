
name: Build and Push to Docker Hub and GHCR Automatically

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the project code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Prepare Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build and push to both registries
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true

          tags: |
            anamzd/basicdevopsuserapipractice-backend:latest
            anamzd/basicdevopsuserapipractice-backend:${{ github.sha }}
            ghcr.io/anamz-d/basicdevopsuserapipractice-backend:latest
            ghcr.io/anamz-d/basicdevopsuserapipractice-backend:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
